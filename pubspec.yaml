name: driver_tracker
description: Driver location tracking with offline-first storage and resilient sync (Flutter + BLoC).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  sqflite: ^2.4.2
  path: ^1.9.0
  connectivity_plus: ^6.1.4
  geolocator: ^14.0.0
  http: ^1.4.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
